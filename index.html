<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз Серцевих Захворювань</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: #f8f9fa;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        .btn-predict {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        
        .btn-predict:hover {
            transform: translateY(-2px);
        }
        
        .btn-predict:active {
            transform: translateY(0);
        }
        
        #result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        
        .result-high-risk {
            background: #fee;
            border: 2px solid #e74c3c;
        }
        
        .result-low-risk {
            background: #efe;
            border: 2px solid #27ae60;
        }
        
        .result-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .result-probability {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .result-description {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .error {
            background: #fee;
            border: 2px solid #e74c3c;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Діагностика Серцевих Захворювань</h1>
        <p>Прогнозування за допомогою машинного навчання (SVM-RBF)</p>
    </div>
    
    <div class="content">
        <form id="predictionForm">
            <div class="grid-2">
                <div class="form-group">
                    <label for="age">Вік (років)</label>
                    <input type="number" id="age" value="65" required>
                </div>
                
                <div class="form-group">
                    <label for="sex">Стать</label>
                    <select id="sex" required>
                        <option value="Male">Чоловік</option>
                        <option value="Female">Жінка</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="trestbps">Артеріальний тиск (мм рт. ст.)</label>
                    <input type="number" id="trestbps" value="140" required>
                </div>
                
                <div class="form-group">
                    <label for="chol">Холестерин (мг/дл)</label>
                    <input type="number" id="chol" value="250" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="cp">Тип болю в грудях</label>
                <select id="cp" required>
                    <option value="asymptomatic">Безсимптомна</option>
                    <option value="typical angina">Типова стенокардія</option>
                    <option value="atypical angina">Атипова стенокардія</option>
                    <option value="non-anginal">Нестенокардіальний біль</option>
                </select>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="fbs">Цукор натще > 120 мг/дл</label>
                    <select id="fbs" required>
                        <option value="0">Ні</option>
                        <option value="1">Так</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="restecg">Результат ЕКГ у спокої</label>
                    <select id="restecg" required>
                        <option value="normal">Нормальний</option>
                        <option value="st-t abnormality">Аномалія ST-T</option>
                        <option value="lv hypertrophy">Гіпертрофія ЛШ</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="thalch">Максимальний пульс</label>
                    <input type="number" id="thalch" value="150" required>
                </div>
                
                <div class="form-group">
                    <label for="exang">Стенокардія при навантаженні</label>
                    <select id="exang" required>
                        <option value="0">Ні</option>
                        <option value="1">Так</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="oldpeak">Депресія ST (oldpeak)</label>
                    <input type="number" id="oldpeak" value="1.2" step="0.1" required>
                </div>
                
                <div class="form-group">
                    <label for="slope">Нахил ST-сегмента</label>
                    <select id="slope" required>
                        <option value="upsloping">Upsloping</option>
                        <option value="flat">Flat</option>
                        <option value="downsloping">Downsloping</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="ca">Кількість судин (0-3)</label>
                    <input type="number" id="ca" value="0" min="0" max="3" required>
                </div>
                
                <div class="form-group">
                    <label for="thal">Таласемія</label>
                    <select id="thal" required>
                        <option value="normal">Нормальний</option>
                        <option value="fixed defect">Фіксований дефект</option>
                        <option value="reversable defect">Зворотний дефект</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn-predict">Прогнозувати Ризик</button>
        </form>
        
        <div id="result"></div>
    </div>
</div>

<script>
    const API_URL = '/predict';
    const form = document.getElementById('predictionForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {
            age: parseFloat(document.getElementById('age').value),
            trestbps: parseFloat(document.getElementById('trestbps').value),
            chol: parseFloat(document.getElementById('chol').value),
            thalch: parseFloat(document.getElementById('thalch').value),
            oldpeak: parseFloat(document.getElementById('oldpeak').value),
            ca: parseInt(document.getElementById('ca').value),
            fbs: parseInt(document.getElementById('fbs').value),
            exang: parseInt(document.getElementById('exang').value),
            sex: document.getElementById('sex').value,
            cp: document.getElementById('cp').value,
            restecg: document.getElementById('restecg').value,
            slope: document.getElementById('slope').value,
            thal: document.getElementById('thal').value
        };

        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerHTML = '<div class="loading">Обробка даних...</div>';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.status === 'success') {
                const isHighRisk = result.prediction_class === 1;
                const probability = (result.probability_disease * 100).toFixed(1);
                
                resultDiv.className = isHighRisk ? 'result-high-risk' : 'result-low-risk';
                resultDiv.innerHTML = `
                    <div class="result-title">
                        ${isHighRisk ? 'ВИСОКИЙ РИЗИК' : 'НИЗЬКИЙ РИЗИК'}
                    </div>
                    <div class="result-probability" style="color: ${isHighRisk ? '#e74c3c' : '#27ae60'}">
                        ${probability}%
                    </div>
                    <div class="result-description">
                        ${result.risk_level}
                    </div>
                `;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>Помилка:</strong> ${result.error}`;
            }
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = '<strong>Помилка з\'єднання:</strong> Переконайтеся, що сервер Flask запущений на порту 5000.';
            console.error(error);
        }
    });
</script>

</body>
</html>
