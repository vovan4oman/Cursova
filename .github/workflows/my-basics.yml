name: CI-CD
env:
  EB_PACKAGE_S3_BACKET_name: "flask-app-pack-vovan4oman"
  EB_APPLICATION_NAME      : "Myflask"
  EB_ENVIRONMENT_NAME      : "Myflask.env"
  DEPLOY_PACKAGE_NAME      : "flask_app_${{ github.sha }}.zip"
  AWS_REGION_NAME          : "eu-north-1"

on: 
  push:
    branches: 
     - main

jobs:
  my_ci_part:
    runs-on: ubuntu-latest

    steps:
    - name: Git-clone
      uses: actions/checkout@v1


    - name: Create ZIP deployment package
      run: zip -r ${{ env.DEPLOY_PACKAGE_NAME }} ./ -x *.git*

    
    - name: Configure my AWS cred
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET }}
        aws-region           : ${{ env.AWS_REGION_NAME }}


    - name: Copy package to S3
      run: aws s3 cp ${{ env.DEPLOY_PACKAGE_NAME }}  s3://${{ env.EB_PACKAGE_S3_BACKET_name }}/


    - name: Print Mes
      run: echo "Ci pipepline finished"

      
