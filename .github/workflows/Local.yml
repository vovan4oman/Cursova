name: Deploy-to-local

on: [workflow_dispatch]


jobs: 
  CI:
    runs-on: self-hosted

    steps:
    - name: Git-clone
      uses: actions/checkout@v4


    - name: Setup Flask
      run: pip install -r requirements.txt 


    - name: Start Server
      run: |
        python3 application.py > server.log 2>&1 &
        echo "Чекаємо 20 секунд на завантаження моделей"
        sleep 20

    - name: Test
      run: | 
        response=$(curl -s http://localhost:5000/health)
        echo "Відповідь сервера: $response"

        curl -fs http://localhost:5000/health > /dev/null

  CD:
    needs: CI
    runs-on: self-hosted

    

    steps:
    - name: Create inventory file
      run: |
        echo "[flaskserver]" > ./ansible/hosts.txt
        echo "server1 ansible_host=${{ secrets.IPSERVER }} ansible_user=${{ secrets.SERVERUSER }}" >> ./ansible/hosts.txt


    
    - name: run Playbook
      run: |
        ansible-playbook -i ./ansible/hosts.txt  ./ansible/DeployServer.yml


    - name: Notification in Telegram
      if: always()
      env:
        TGID: ${{ secrets.TGID }}
        BOTAPI: ${{ secrets.BOTAPI }}
      run: |
        pip install requests
        python3 ./notofications/notification.py ${{ job.status }}
        
      

        
